name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check site structure, assets, metadata and PDF
        run: python3 scripts/check_site.py
      - name: Check browser JavaScript syntax
        run: |
          node --check script.js
          node --input-type=module --check < framer-motion.js
